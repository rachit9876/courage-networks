<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courage the Cowardly Dog Archive</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link rel="shortcut icon" type="image/webp" href="assets/logo.webp">
    <link rel="apple-touch-icon" href="assets/logo.webp">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="index-only">
    <header class="app-bar">
        <div class="container">
            <a href="index.html"><img src="assets/logo.webp" alt="Logo" class="app-logo"></a>
        </div>
    </header>

    <main class="container">
        <div class="hero">
            <div class="computer-wrapper">
                <div class="skeleton hero-skeleton" id="hero-skeleton"></div>
                <img src="assets/char/computerSimon.webp" alt="Computer" class="hero-image" loading="eager" hidden>
                <div class="screen-text" id="typing-text"></div>
            </div>
            <nav>
                <a href="https://game-networks.pages.dev/courage/" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-game"></use></svg>Web Game
                </a>
                <a href="researchPaper/ResearchPaper.pdf" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-research"></use></svg>Research
                </a>
                <button type="button" class="nav-btn" data-open-language>
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-play"></use></svg>Watch Now
                </button>
                <a href="pages/ost.html" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-music"></use></svg>OST
                </a>
                <a href="pages/episodes.html" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-episodes"></use></svg>Episodes Info
                </a>
                <a href="pages/gallery.html" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-gallery"></use></svg>Gallery
                </a>
                <a href="pages/cookbook.html" class="nav-btn">
                    <svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#icon-research"></use></svg>Muriel's Recipe
                </a>
            </nav>
            <h2 class="hero-title">Choose Above</h2>
        </div>
    </main>

    <div id="languageModal" class="modal">
        <div class="modal-content modal-content--narrow">
            <button class="modal-close" type="button" aria-label="Close" data-close-language>
                <svg aria-hidden="true"><use href="assets/icons.svg#icon-close"></use></svg>
            </button>
            <h2 class="modal-title">Choose Language</h2>
            <div class="modal-actions">
                <a href="https://schan.pages.dev/player?show=courage-eng&episode=1" class="nav-btn">English</a>
                <a href="https://schan.pages.dev/player?show=courage-hindi&episode=1" class="nav-btn">Hindi</a>
            </div>
        </div>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
