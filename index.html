<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courage the Cowardly Dog Archive</title>
        <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
        <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
        <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link rel="shortcut icon" type="image/webp" href="assets/logo.webp">
    <link rel="apple-touch-icon" href="assets/logo.webp">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="index-only">
    <header class="app-bar">
        <div class="container">
            <a href="index.html"><img src="assets/logo.webp" alt="Logo" class="app-logo"></a>
        </div>
    </header>

    <main class="container">
        <div class="hero">
            <div class="computer-wrapper">
                <div class="skeleton" style="width: 100%; aspect-ratio: 16/9; border-radius: clamp(16px, 2vw, 24px);" id="hero-skeleton"></div>
                <img src="assets/char/computerSimon.webp" alt="Computer" class="hero-image" loading="eager" style="display: none;" onload="this.style.display='block'; document.getElementById('hero-skeleton').style.display='none';">
                <div class="screen-text" id="typing-text"></div>
            </div>
            <nav>
                <a href="https://game-networks.pages.dev/courage/" class="nav-btn">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-game"/></svg>Web Game
                </a>
                <a href="researchPaper/ResearchPaper.pdf" class="nav-btn">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-research"/></svg>Research
                </a>
                <a onclick="openLanguageModal()" class="nav-btn glow">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-play"/></svg>Watch Now
                </a>
                <a href="pages/ost.html" class="nav-btn">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-music"/></svg>OST
                </a>
                <a href="pages/episodes.html" class="nav-btn">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-episodes"/></svg>Episodes Info
                </a>
                <a href="pages/gallery.html" class="nav-btn">
                    <svg class="nav-icon"><use href="assets/icons.svg#icon-gallery"/></svg>Gallery
                </a>
            </nav>
            <h2 class="hero-title">Choose Above</h2>
        </div>
    </main>

    <div id="languageModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <button class="modal-close" onclick="closeLanguageModal()">&times;</button>
            <h2 class="modal-title">Choose Language</h2>
            <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">
                <a href="https://schan.pages.dev/player?show=courage-eng&episode=1" class="nav-btn" style="text-align: center;">English</a>
                <a href="https://schan.pages.dev/player?show=courage-hindi&episode=1" class="nav-btn" style="text-align: center;">Hindi</a>
            </div>
        </div>
    </div>

    <script>
        function openLanguageModal() {
            document.getElementById('languageModal').classList.add('active');
            document.body.classList.add('modal-open');
        }
        function closeLanguageModal() {
            document.getElementById('languageModal').classList.remove('active');
            document.body.classList.remove('modal-open');
        }
        document.getElementById('languageModal').addEventListener('click', function(e) {
            if (e.target === this) closeLanguageModal();
        });
    </script>
</body>
</html>
