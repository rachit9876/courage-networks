<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episodes - Courage Networks</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-bar">
        <div class="container">
            <h1 class="logo"><a href="../index.html" style="color: inherit; text-decoration: none;">Courage Networks</a></h1>
            <nav>
                <a href="../index.html" class="nav-btn">Home</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2>Episodes</h2>
            <div class="search-bar">
                <input type="text" id="episode-search" placeholder="Search episodes...">
            </div>
        </div>
        <div id="episodes-grid" class="grid"></div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="../js/episodes.js"></script>
</body>
</html>
